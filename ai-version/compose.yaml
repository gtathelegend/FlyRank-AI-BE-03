services:
  db:
    image: postgres:latest
    container_name: taskdb_ai
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks
    ports:
      - "5433:5432"
    volumes:
      - taskdb_data_ai:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: taskapi_ai
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:dev@db:5432/tasks
    depends_on:
      db:
        condition: service_healthy

volumes:
  taskdb_data_ai:
